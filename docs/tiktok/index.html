<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ee" />
    <title>今すぐタイマー | よく使うタイマーを、ワンタップで起動</title>
    <meta
      name="description"
      content="ホーム画面・ロック画面のウィジェットから、よく使うタイマーをワンタップで起動できるiPhoneアプリ。"
    />
    <style>
      :root {
        --accent: #ff6a1a;
        --ink: #111111;
        --muted: #6c655f;
        --paper: #f7f3ee;
        --surface: rgba(255, 255, 255, 0.72);
        --line: rgba(17, 17, 17, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% -12%, rgba(255, 106, 26, 0.18), transparent 34%),
          linear-gradient(180deg, #fffaf6 0%, var(--paper) 58%, #ffffff 100%);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic",
          sans-serif;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      a {
        color: inherit;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .page {
        width: min(100%, 560px);
        min-height: 100svh;
        margin: 0 auto;
        padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
      }

      .hero {
        min-height: calc(100svh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }

      .brand {
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }

      .icon-shell {
        width: 72px;
        height: 72px;
        padding: 5px;
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow:
          0 20px 48px rgba(43, 30, 18, 0.12),
          0 1px 0 rgba(255, 255, 255, 0.9) inset;
      }

      .app-icon,
      .icon-fallback {
        width: 62px;
        height: 62px;
        border-radius: 17px;
      }

      .icon-fallback {
        display: none;
        place-items: center;
        color: var(--accent);
        background: #fff2e8;
        font-size: 23px;
        font-weight: 800;
      }

      .app-name {
        margin: 0;
        font-size: 18px;
        line-height: 1.1;
        font-weight: 700;
      }

      h1 {
        max-width: 450px;
        margin: 0 auto;
        text-align: center;
        font-size: clamp(34px, 9.6vw, 54px);
        line-height: 1.06;
        font-weight: 800;
      }

      .accent {
        color: var(--accent);
      }

      .lead {
        max-width: 330px;
        margin: -8px auto 0;
        color: var(--muted);
        text-align: center;
        font-size: 15px;
        line-height: 1.75;
        font-weight: 500;
      }

      .store-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 58px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        color: #ffffff;
        background: #111111;
        box-shadow:
          0 18px 42px rgba(17, 17, 17, 0.22),
          0 1px 0 rgba(255, 255, 255, 0.12) inset;
        text-decoration: none;
        font-size: 16px;
        font-weight: 700;
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          background 140ms ease;
      }

      .store-button::before {
        content: "";
        width: 9px;
        height: 9px;
        margin-right: 10px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(255, 106, 26, 0.2);
      }

      .store-button:active {
        transform: translateY(1px) scale(0.992);
        background: #1b1b1b;
        box-shadow: 0 12px 28px rgba(17, 17, 17, 0.2);
      }

      .preview {
        margin: 2px -18px 0;
      }

      .rail {
        display: flex;
        gap: 12px;
        padding: 0 18px 8px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }

      .rail::-webkit-scrollbar {
        display: none;
      }

      .shot {
        width: min(82vw, 420px);
        margin: 0;
        flex: 0 0 auto;
        overflow: hidden;
        scroll-snap-align: center;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 22px;
        background: var(--accent);
        box-shadow: 0 18px 44px rgba(43, 30, 18, 0.14);
      }

      .shot img {
        width: 100%;
        aspect-ratio: 2888 / 1242;
        object-fit: cover;
      }

      .shot-fallback {
        display: none;
        min-height: 154px;
        place-items: center;
        padding: 18px;
        color: #ffffff;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
      }

      .note {
        margin: -4px auto 0;
        max-width: 310px;
        color: #8a837b;
        text-align: center;
        font-size: 11px;
        line-height: 1.6;
        font-weight: 500;
      }

      @media (min-width: 520px) {
        .page {
          padding-inline: 24px;
        }

        .preview {
          margin-inline: -24px;
        }

        .rail {
          padding-inline: 24px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .brand,
        h1,
        .lead,
        .store-button,
        .preview,
        .note {
          animation: enter 560ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        h1 {
          animation-delay: 60ms;
        }

        .lead {
          animation-delay: 100ms;
        }

        .store-button {
          animation-delay: 140ms;
        }

        .preview {
          animation-delay: 180ms;
        }

        .note {
          animation-delay: 220ms;
        }

        @keyframes enter {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="app-title">
        <div class="brand">
          <div class="icon-shell" aria-hidden="true">
            <img
              class="app-icon"
              src="../assets/icon.png"
              alt=""
              onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
            />
            <div class="icon-fallback">今</div>
          </div>
          <p class="app-name">今すぐタイマー</p>
        </div>

        <h1 id="app-title">タイマーを、<span class="accent">1タップ</span>で。</h1>
        <p class="lead">ホーム画面・ロック画面のウィジェットからすぐ起動。</p>

        <a class="store-button" data-store-link href="#" rel="noopener">App Storeで開く</a>

        <section class="preview" aria-label="アプリ画面">
          <div class="rail">
            <figure class="shot">
              <img
                src="../assets/store/pattern3/1.png"
                alt="ウィジェットからワンタップでタイマーを開始できる紹介画像"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
              />
              <figcaption class="shot-fallback">1タップでタイマー開始</figcaption>
            </figure>
            <figure class="shot">
              <img
                src="../assets/store/pattern3/2.png"
                alt="よく使うタイマーをすぐ起動できる紹介画像"
                loading="lazy"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
              />
              <figcaption class="shot-fallback">よく使うタイマーをすぐ起動</figcaption>
            </figure>
            <figure class="shot">
              <img
                src="../assets/store/pattern3/3.png"
                alt="色とアイコンでプリセットを作れる紹介画像"
                loading="lazy"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
              />
              <figcaption class="shot-fallback">プリセットを作成</figcaption>
            </figure>
          </div>
        </section>

        <p class="note">開けない場合は、右上のメニューからSafariで開いてください。</p>
      </section>
    </main>

    <script>
      const APP_STORE_URL = "https://apps.apple.com/jp/app/%E4%BB%8A%E3%81%99%E3%81%90%E3%82%BF%E3%82%A4%E3%83%9E%E3%83%BC-%E3%82%A6%E3%82%A3%E3%82%B8%E3%82%A7%E3%83%83%E3%83%88%E3%81%8B%E3%82%89%E3%82%AB%E3%83%B3%E3%82%BF%E3%83%B3%E8%B5%B7%E5%8B%95/id6782746504";

      document.querySelectorAll("[data-store-link]").forEach((link) => {
        link.href = APP_STORE_URL;
      });
    </script>
  </body>
</html>
