<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>今すぐタイマー | よく使うタイマーを、ワンタップで起動</title>
    <meta
      name="description"
      content="ホーム画面・ロック画面のウィジェットから、よく使うタイマーをワンタップで起動できるiPhoneアプリ。"
    />
    <style>
      :root {
        --accent: #ff6a1a;
        --accent-dark: #e95400;
        --ink: #17130f;
        --muted: #6d6660;
        --soft: #fff3ec;
        --line: #f0e7df;
        --paper: #ffffff;
        --shadow: 0 18px 50px rgba(255, 106, 26, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% -6%, rgba(255, 106, 26, 0.16), transparent 32%),
          linear-gradient(180deg, #ffffff 0%, #fffaf7 100%);
        font-family:
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic",
          "Noto Sans JP", system-ui, sans-serif;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(100%, 520px);
        min-height: 100svh;
        margin: 0 auto;
        padding: calc(24px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));
      }

      .hero {
        display: grid;
        justify-items: center;
        text-align: center;
        padding-top: 10px;
      }

      .icon-wrap {
        position: relative;
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
      }

      .icon-wrap::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 34px;
        background: linear-gradient(135deg, rgba(255, 106, 26, 0.24), rgba(255, 255, 255, 0));
        transform: rotate(-5deg);
      }

      .app-icon,
      .icon-fallback {
        position: relative;
        width: 100px;
        height: 100px;
        border-radius: 25px;
        box-shadow: var(--shadow);
      }

      .app-icon {
        display: block;
      }

      .icon-fallback {
        display: none;
        place-items: center;
        color: var(--accent);
        background: var(--soft);
        border: 1px solid var(--line);
        font-size: 32px;
        font-weight: 900;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 9vw, 42px);
        line-height: 1.08;
        font-weight: 900;
      }

      .copy {
        margin: 14px 0 0;
        max-width: 340px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
        font-weight: 650;
      }

      .store-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 58px;
        margin-top: 24px;
        border-radius: 18px;
        color: #ffffff;
        background: linear-gradient(180deg, #ff7a2f 0%, var(--accent) 100%);
        box-shadow: 0 16px 30px rgba(255, 106, 26, 0.28);
        text-decoration: none;
        font-size: 17px;
        font-weight: 900;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .store-button:active {
        transform: translateY(1px) scale(0.99);
        box-shadow: 0 10px 22px rgba(255, 106, 26, 0.24);
      }

      .features {
        display: grid;
        gap: 12px;
        margin: 28px 0 0;
      }

      .feature {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 14px;
        align-items: center;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 28px rgba(35, 24, 13, 0.04);
      }

      .mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 15px;
        color: var(--accent);
        background: var(--soft);
      }

      .mark svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .feature strong {
        display: block;
        font-size: 15px;
        font-weight: 900;
      }

      .feature span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        font-weight: 600;
      }

      .bottom {
        margin-top: 26px;
        padding-top: 2px;
      }

      .note {
        margin: 14px auto 0;
        max-width: 310px;
        color: #8a817a;
        text-align: center;
        font-size: 12px;
        line-height: 1.6;
        font-weight: 600;
      }

      .fine {
        margin: 18px 0 0;
        color: #aaa19a;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
      }

      @media (min-width: 480px) {
        .page {
          padding-inline: 34px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .hero,
        .feature,
        .bottom {
          animation: rise 560ms ease both;
        }

        .features .feature:nth-child(1) {
          animation-delay: 80ms;
        }

        .features .feature:nth-child(2) {
          animation-delay: 150ms;
        }

        .features .feature:nth-child(3) {
          animation-delay: 220ms;
        }

        .bottom {
          animation-delay: 280ms;
        }

        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(12px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="app-title">
        <div class="icon-wrap" aria-hidden="true">
          <img
            class="app-icon"
            src="../assets/icon.png"
            alt=""
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
          />
          <div class="icon-fallback">今</div>
        </div>

        <p class="eyebrow">iPhoneタイマーアプリ</p>
        <h1 id="app-title">今すぐタイマー</h1>
        <p class="copy">よく使うタイマーを、ワンタップで起動</p>

        <a class="store-button" data-store-link href="#" rel="noopener">App Storeへ進む</a>
      </section>

      <section class="features" aria-label="主な機能">
        <div class="feature">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 5h12" /><path d="M8 12h8" /><path d="M10 19h4" /></svg>
          </div>
          <div>
            <strong>よく使う時間を保存</strong>
            <span>3分、20分、50分。毎回セットする手間を減らせます。</span>
          </div>
        </div>

        <div class="feature">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3" /><path d="M8 9h3" /><path d="M8 13h8" /></svg>
          </div>
          <div>
            <strong>ウィジェットから起動</strong>
            <span>ホーム画面・ロック画面から、すぐタイマーを始められます。</span>
          </div>
        </div>

        <div class="feature">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3v4" /><path d="M12 17v4" /><path d="M4.2 7.5l3.5 2" /><path d="M16.3 14.5l3.5 2" /><path d="M19.8 7.5l-3.5 2" /><path d="M7.7 14.5l-3.5 2" /><circle cx="12" cy="12" r="3.4" /></svg>
          </div>
          <div>
            <strong>生活のちょっとした時間に</strong>
            <span>カップ麺、仮眠、勉強、休憩。思いついた瞬間に使えます。</span>
          </div>
        </div>
      </section>

      <section class="bottom">
        <a class="store-button" data-store-link href="#" rel="noopener">App Storeで見る</a>
        <p class="note">開けない場合は、右上のメニューからSafariで開いてください。</p>
        <p class="fine">iOS 26以降対応</p>
      </section>
    </main>

    <script>
      const APP_STORE_URL = "https://x.gd/z4Jle";

      document.querySelectorAll("[data-store-link]").forEach((link) => {
        link.href = APP_STORE_URL;
      });
    </script>
  </body>
</html>
